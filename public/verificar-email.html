<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Email</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <h1>Verificar e-mail</h1>

<p>
    Enviamos um código de 6 dígitos para seu e-mail.
</p>

<form id="form-verificacao">

    <div>
        <input id="codigo" type="text" maxlength="6">
    </div>

    <button type="submit">
        Verificar
    </button>

    <button type="button" id="reenviar-codigo">
        Reenviar código
    </button>

</form>

<p id="mensagem"></p>

<script src="js/verificar-email.js"></script>
</body>
</html>
