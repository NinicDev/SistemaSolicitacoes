<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

    <h1>Login</h1>

    <form id="form-login">

        <div>
            <label for="usuario">Usuário</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                required
            >
        </div>

        <div>
            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                required
            >
        </div>

        <button type="submit">
            Entrar
        </button>

    </form>

    <a href="cadastro.html">
        Criar conta
    </a>

     <a href="verificar-email-senha.html">
        Esqueci minha senha
    </a>

    <p id="mensagem"></p>

    <script src="./js/login.js"></script>

</body>
</html>
