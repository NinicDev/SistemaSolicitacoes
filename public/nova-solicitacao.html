<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Solicitação</title>
    <link rel="stylesheet" href="./css/nova-solicitacao.css">
    <link rel="stylesheet" href="css/anexos.css">
</head>

<body>
    <a href="./inicio.html" class="voltar">← Voltar para o início</a>
    <section class="card">
        <h2>Formulário da Solicitação</h2>

        <p>
            Campos marcados com
            <span class="obrigatorio">*</span>
            serão obrigatórios no sistema.
            Por enquanto eles não usam "required" para que possamos testar
            também as validações do backend.
        </p>

        <form id="solicitacao-form">

            <div class="linha">
                <div class="campo">
                    <label for="nome">
                        Nome <span class="obrigatorio">*</span>
                    </label>

                    <input
                        type="text"
                        id="nome"
                        maxlength="80"
                        placeholder="Nome completo"
                    >
                </div>
            </div>

            <div class="linha-3">
                <div class="campo">
                    <label for="cpf">
                        CPF <span class="obrigatorio">*</span>
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        maxlength="14"
                        inputmode="numeric"
                        placeholder="CPF"
                    >
                </div>

                <div class="campo">
                    <label for="rg">RG</label>

                    <input
                        type="text"
                        id="rg"
                        maxlength="20"
                        placeholder="RG"
                    >
                </div>

                <div class="campo">
                    <label for="telefone-celular">Telefone celular</label>

                    <input
                        type="text"
                        id="telefone-celular"
                        maxlength="15"
                        inputmode="tel"
                        placeholder="Telefone celular"
                    >
                </div>
            </div>

            <div class="linha-3">
                <div class="campo">
                    <label for="cep">
                        CEP <span class="obrigatorio">*</span>
                    </label>

                    <input
                        type="text"
                        id="cep"
                        maxlength="9"
                        inputmode="numeric"
                        placeholder="CEP"
                    >
                </div>

                <div class="campo">
                    <label for="numero">Número</label>

                    <input
                        type="text"
                        id="numero"
                        maxlength="4"
                        placeholder="Número"
                    >
                </div>

                <div class="campo">
                    <label for="complemento">Complemento</label>

                    <input
                        type="text"
                        id="complemento"
                        maxlength="100"
                        placeholder="Complemento"
                    >
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="rua">Rua</label>

                    <input
                        type="text"
                        id="rua"
                        maxlength="150"
                        placeholder="Rua"
                    >
                </div>

                <div class="campo">
                    <label for="bairro">Bairro</label>

                    <input
                        type="text"
                        id="bairro"
                        maxlength="150"
                        placeholder="Bairro"
                    >
                </div>
            </div>

            <div class="linha-3">
                <div class="campo">
                    <label for="cidade">Cidade</label>

                    <input
                        type="text"
                        id="cidade"
                        maxlength="40"
                        placeholder="Cidade"
                    >
                </div>

                <div class="campo">
                    <label for="uf">UF</label>

                    <input
                        type="text"
                        id="uf"
                        maxlength="2"
                        placeholder="SP"
                        oninput="this.value = this.value.replace(/[^a-zA-Z]/g, '').toUpperCase()"
                    >
                </div>

                <div class="campo">
                    <label for="responsavel-id">Responsável</label>

                    <select id="responsavel-id">
                        <option value="">
                            Selecione um responsável
                        </option>
                    </select>
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="tipo-servico-id">
                        Tipo de serviço <span class="obrigatorio">*</span>
                    </label>

                    <select id="tipo-servico-id">
                        <option value="">
                            Selecione um tipo de serviço
                        </option>
                    </select>
                </div>

                <div class="campo">
                    <label for="prioridade">
                        Prioridade
                        <span class="obrigatorio">*</span>
                    </label>

                    <select id="prioridade">
                        <option value="MEDIO" selected>MÉDIO</option>
                        <option value="BAIXO">BAIXO</option>
                        <option value="ALTO">ALTO</option>
                    </select>
                </div>

            </div>

            <div class="campo">
                <label for="descricao">Descrição</label>

                <textarea
                    id="descricao"
                    maxlength="5000"
                    placeholder="Descreva a solicitação"
                ></textarea>
            </div>

            <div class="acoes">
                <button type="button" id="criar">
                    Criar solicitação
                </button>

                <button type="button" id="limpar">
                    Limpar formulário
                </button>
            </div>

            <button type="button" id="anexar-img">
                Anexar imagem
            </button>

            <input
                type="file"
                id="input-anexos"
                accept="image/png, image/jpeg"
                multiple
                hidden
            >

            <div id="anexos-pendentes"></div>

        </form>
        
        

        <div id="mensagem-solicitacao" class="mensagem">
            Nenhuma operação realizada ainda.
        </div>
    </section>

    <div id="modal-imagem" class="modal-imagem">
        <span id="fechar-modal">&times;</span>

        <img id="imagem-ampliada" alt="Imagem ampliada">
    </div>

    <script type="module" src="./js/nova-solicitacao.js"></script>
</body>
</html>
