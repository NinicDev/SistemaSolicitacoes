<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Solicitação</title>
    <link rel="stylesheet" href="./css/solicitacao.css">
    <link rel="stylesheet" href="css/anexos.css">
</head>

<body>
    <a href="./inicio.html" class="voltar">← Voltar para o início</a>
    <section class="card">
        <h2>Visualizar Solicitação</h2>

        <form id="solicitacao-form">

            <div class="linha">
                <div class="campo">
                    <label for="nome">
                        Nome <span class="obrigatorio">*</span>
                    </label>

                    <input
                        type="text"
                        id="nome"
                        maxlength="80"
                        placeholder="Nome completo"
                        disabled
                    >
                </div>
            </div>

            <div class="linha-3">
                <div class="campo">
                    <label for="cpf">
                        CPF <span class="obrigatorio">*</span>
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        maxlength="14"
                        inputmode="numeric"
                        placeholder="CPF"
                        disabled
                    >
                </div>

                <div class="campo">
                    <label for="rg">RG</label>

                    <input
                        type="text"
                        id="rg"
                        maxlength="20"
                        placeholder="RG"
                        disabled
                    >
                </div>

                <div class="campo">
                    <label for="telefone-celular">Telefone celular</label>

                    <input
                        type="text"
                        id="telefone-celular"
                        maxlength="15"
                        inputmode="tel"
                        placeholder="Telefone celular"
                        disabled
                    >
                </div>
            </div>

            <div class="linha-3">
                <div class="campo">
                    <label for="cep">
                        CEP <span class="obrigatorio">*</span>
                    </label>

                    <input
                        type="text"
                        id="cep"
                        maxlength="9"
                        inputmode="numeric"
                        placeholder="CEP"
                        disabled
                    >
                </div>

                <div class="campo">
                    <label for="numero">Número</label>

                    <input
                        type="text"
                        id="numero"
                        maxlength="4"
                        placeholder="Número"
                        disabled
                    >
                </div>

                <div class="campo">
                    <label for="complemento">Complemento</label>

                    <input
                        type="text"
                        id="complemento"
                        maxlength="100"
                        placeholder="Complemento"
                        disabled
                    >
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="rua">Rua</label>

                    <input
                        type="text"
                        id="rua"
                        maxlength="150"
                        placeholder="Rua"
                        disabled
                    >
                </div>

                <div class="campo">
                    <label for="bairro">Bairro</label>

                    <input
                        type="text"
                        id="bairro"
                        maxlength="150"
                        placeholder="Bairro"
                        disabled
                    >
                </div>
            </div>

            <div class="linha-3">
                <div class="campo">
                    <label for="cidade">Cidade</label>

                    <input
                        type="text"
                        id="cidade"
                        maxlength="40"
                        placeholder="Cidade"
                        disabled
                    >
                </div>

                <div class="campo">
                    <label for="uf">UF</label>

                    <input
                        type="text"
                        id="uf"
                        maxlength="2"
                        placeholder="SP"
                        oninput="this.value = this.value.replace(/[^a-zA-Z]/g, '').toUpperCase()"
                        disabled
                    >
                </div>

                <div class="campo">
                    <label for="responsavel-id">Responsável</label>

                    <select id="responsavel-id" disabled>
                        <option value="">
                            Selecione um responsável
                        </option>
                    </select>
                </div>
            </div>

            <div class="linha-3">
                <div class="campo">
                    <label for="tipo-servico-id">
                        Tipo de serviço <span class="obrigatorio">*</span>
                    </label>

                    <select id="tipo-servico-id" disabled>
                        <option value="">
                            Selecione um tipo de serviço
                        </option>
                    </select>
                </div>

                <div class="campo">
                    <label for="prioridade">
                        Prioridade
                        <span class="obrigatorio">*</span>
                    </label>

                    <select id="prioridade" disabled>
                        <option value="MEDIO" selected>MÉDIO</option>
                        <option value="BAIXO">BAIXO</option>
                        <option value="ALTO">ALTO</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="status">Status</label>

                    <select id="status" disabled>
                        <option value="ABERTA">ABERTA</option>
                        <option value="EM_ANDAMENTO">EM ANDAMENTO</option>
                        <option value="CONCLUIDA">CONCLUÍDA</option>
                        <option value="CANCELADA">CANCELADA</option>
                    </select>
                </div>
            </div>

            <div class="campo">
                <label for="descricao">Descrição</label>

                <textarea
                    id="descricao"
                    maxlength="5000"
                    placeholder="Descreva a solicitação"
                    disabled
                ></textarea>
            </div>

            <div class="acoes">
                <button type="button" id="editar" hidden>
                    Editar
                </button>

                <button type="button" id="excluir" hidden>
                    Excluir
                </button>

                <button type="button" id="imprimir">
                    Imprimir
                </button>
                <button type="button" id="cancelar" disabled hidden>
                    Cancelar
                </button>
            </div>
            <div class="area-anexos">

                <button
                    type="button"
                    id="anexar-img"
                    disabled
                    hidden
                >
                    Anexar imagens
                </button>
                
                <input
                    type="file"
                    id="input-anexos"
                    accept="image/png, image/jpeg"
                    multiple
                    hidden
                >
                <div id="anexos-pendentes"></div>

                <div id="lista-anexos"></div>

            </div>

        </form>

        <div id="mensagem-solicitacao" class="mensagem">
            Nenhuma operação realizada ainda.
        </div>

    </section>

    <div id="modal-imagem" class="modal-imagem">
        <span id="fechar-modal">&times;</span>

        <img id="imagem-ampliada" alt="Imagem ampliada">
    </div>

    <script type="module" src="./js/solicitacao.js"></script>
</body>
</html>
